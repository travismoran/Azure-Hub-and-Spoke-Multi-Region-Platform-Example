# Static checks that need no Azure credentials at all.
# Secret scanning lives in gitleaks.yml (gitleaks-action, licensed for the org).
# Everything here runs on any fork out of the box.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.15.8
  TERRAGRUNT_VERSION: 1.1.1

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terragrunt hcl format
        run: terragrunt hcl fmt --check

      - name: terragrunt hcl validate
        run: terragrunt hcl validate --working-dir live

      - name: Validate wrapper modules
        run: |
          for m in modules/*/; do
            echo "== $m"
            terraform -chdir="$m" init -backend=false -input=false > /dev/null
            terraform -chdir="$m" validate
          done

      # With TG_STATE_* unset, live/root.hcl falls back to a local backend and
      # hub outputs are mocked, so the entire dependency graph validates
      # offline - no Azure subscription involved.
      - name: Validate full live tree (offline, mocked dependencies)
        working-directory: live
        env:
          TG_NON_INTERACTIVE: "true"
          TG_PROVIDER_CACHE: "1"
        run: terragrunt run --all -- validate

  lint-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install pinned tools (tflint, trivy, terraform-docs)
        run: |
          scripts/install-tools.sh tflint trivy terraform-docs
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tflint (modules)
        # tflint --init downloads the azurerm ruleset from GitHub releases;
        # unauthenticated runner IPs hit the API rate limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lint.sh tflint

      - name: trivy config scan
        run: scripts/lint.sh trivy

      - name: module READMEs are current (terraform-docs)
        run: scripts/lint.sh docs-check
